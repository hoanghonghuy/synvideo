name: CI

on:
  pull_request:
    branches:
      - develop
  push:
    branches:
      - develop

jobs:
  web:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.20.0
          cache: npm
      - run: node --version && npm --version
      - run: npm ci
      - run: npm run lint:web
      - run: npm run typecheck:web
      - run: npm run test:web
      - run: npm run build:web

  api:
    name: Backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: synvideo_test
          POSTGRES_USER: synvideo
          POSTGRES_PASSWORD: synvideo_dev_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U synvideo -d synvideo_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SYNVIDEO_ENV: test
      SYNVIDEO_DATABASE_URL: postgres://synvideo:synvideo_dev_password@localhost:5432/synvideo_test?sslmode=disable
      SYNVIDEO_TEST_DATABASE_URL: postgres://synvideo:synvideo_dev_password@localhost:5432/synvideo_test?sslmode=disable
      SYNVIDEO_LOCAL_ACTOR_ID: 11111111-1111-4111-8111-111111111111
      SYNVIDEO_MEDIA_STORAGE_ENDPOINT: http://localhost:8333
      SYNVIDEO_MEDIA_STORAGE_REGION: local
      SYNVIDEO_MEDIA_STORAGE_BUCKET: synvideo-local
      SYNVIDEO_MEDIA_STORAGE_ACCESS_KEY_ID: synvideo
      SYNVIDEO_MEDIA_STORAGE_SECRET_ACCESS_KEY: synvideo_dev_password
      SYNVIDEO_MEDIA_STORAGE_PATH_STYLE: "true"
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: apps/api/go.mod
      - name: Start S3-compatible integration storage
        run: docker compose -f ../../infra/docker-compose.yml up -d --wait seaweed-s3
      - run: test -z "$(gofmt -l .)"
      - run: go run ./cmd/migrate up
      - run: go vet ./...
      - run: go test ./...
      - run: go build ./cmd/api

  compose:
    name: Local Infrastructure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker compose -f infra/docker-compose.yml config
