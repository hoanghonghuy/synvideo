name: TASK-036 Format Helper

on:
  push:
    branches:
      - feature/TASK-036-scene-editor-v1

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/TASK-036-scene-editor-v1
      - uses: actions/setup-go@v7
        with:
          go-version-file: apps/api/go.mod
      - name: Format TASK-036 Go sources
        run: |
          gofmt -w \
            apps/api/internal/httpserver/scene_editor.go \
            apps/api/internal/httpserver/scene_editor_routes.go \
            apps/api/internal/postgres/scene_editor_repository.go \
            apps/api/internal/postgres/scene_editor_repository_integration_test.go \
            apps/api/internal/sceneeditor/composition.go \
            apps/api/internal/sceneeditor/composition_test.go \
            apps/api/internal/sceneeditor/operations.go \
            apps/api/internal/sceneeditor/reconciliation.go \
            apps/api/internal/sceneeditor/reconciliation_test.go \
            apps/api/internal/sceneeditor/repository.go \
            apps/api/internal/sceneeditor/service.go \
            apps/api/internal/sceneeditor/service_test.go
      - name: Commit formatting only when needed
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/internal/httpserver/scene_editor.go \
            apps/api/internal/httpserver/scene_editor_routes.go \
            apps/api/internal/postgres/scene_editor_repository.go \
            apps/api/internal/postgres/scene_editor_repository_integration_test.go \
            apps/api/internal/sceneeditor
          git commit -m "style: gofmt TASK-036 sources"
          git push origin HEAD:feature/TASK-036-scene-editor-v1
